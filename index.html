  if(!r.length)return '<h1>Historial</h1><p class="sub">Aquí aparecerán los pedidos que marques como hechos.</p>';
  const g={};r.forEach(x=>(g[x.date]=g[x.date]||[]).push(x));
  return '<h1>Historial</h1><p class="sub">Pedidos hechos, por día y fecha.</p>'+Object.keys(g).map(d=>`<h2 class="dh">${esc(fdate(d))}</h2>`+g[d].map(x=>`<details class="card" style="--c:${(find(x.sid)||{}).color||'#555'}"><summary>${esc(x.name)}<span class="cnt">hecho ${ftime(x.ts)}${x.deliver?' · llega el '+x.deliver.toLowerCase():''} · ${x.items.length} art.</span></summary>${x.items.length?x.items.map(i=>`<div class="it"><span>${esc(i.n)}</span><span class="stk">${esc(i.q)}</span></div>`).join(''):'<div class="it"><span class="stk">Sin artículos marcados.</span></div>'}<button class="del" data-a="delH" data-k="${x.key}">Borrar del historial</button></details>`).join('')).join('');
}
function supView(){
  return `<h1>Proveedores</h1><p class="sub">Cambia nombre, teléfono, color, días de pedido y artículos. Se guarda al salir de cada casilla.</p>${mbForm()}<div class="add"><input id="nn" placeholder="Nombre del nuevo proveedor"><button class="btn" data-a="addS">Añadir proveedor</button></div>`+
  st.sup.map(s=>`<details class="card" style="--c:${s.color}" ${open==s.id?'open':''}><summary><span><span class="dot"></span>${esc(s.name)}</span><span class="cnt">${s.days.map(d=>DAYS[d].slice(0,3)).join(', ')||'sin día fijo'}</span></summary>
  <label class="f">Nombre<input data-a="name" data-s="${s.id}" value="${esc(s.name)}"></label>
  <label class="f">Teléfono<input data-a="phone" data-s="${s.id}" value="${esc(s.phone)}"></label>
  <label class="f">Color<input type="color" data-a="color" data-s="${s.id}" value="${s.color}"></label>
  <label class="f days" style="padding-top:10px"><input type="checkbox" data-a="pet" data-s="${s.id}" ${s.pet?'checked':''}>Es por petitorio (en Inicio muestra los productos que deben entrar)</label>
  <div class="f">Días en que haces el pedido<div class="days">${[1,2,3,4,5,6,7].map(d=>`<label><input type="checkbox" data-a="day" data-s="${s.id}" data-d="${d}" ${s.days.includes(d)?'checked':''}>${DAYS[d].slice(0,3)}</label>`).join('')}</div></div>
  <div class="f">Artículos (${s.items.length}): nombre, stock y nota</div>${s.items.map(i=>`<div class="it"><input data-a="iname" data-s="${s.id}" data-i="${i.id}" value="${esc(i.name)}" aria-label="Nombre del artículo"><input class="sm" data-a="istock" data-s="${s.id}" data-i="${i.id}" value="${esc(i.stock)}" placeholder="Stock" aria-label="Stock"><input class="sm" data-a="inote" data-s="${s.id}" data-i="${i.id}" value="${esc(i.note)}" placeholder="Nota" aria-label="Nota"><button class="rm" data-a="delI" data-s="${s.id}" data-i="${i.id}" aria-label="Quitar ${esc(i.name)}">Quitar</button></div>`).join('')}
  <div class="addi"><input id="ni-${s.id}" placeholder="Artículo nuevo"><input id="ns-${s.id}" placeholder="Stock (ej. 4 cajas)"><button class="btn" data-a="addI" data-s="${s.id}">Añadir artículo</button></div>
  <button class="del" data-a="delS" data-s="${s.id}">${confirmDel==s.id?'Pulsa otra vez para borrar':'Borrar proveedor'}</button></details>`).join('');
}
function printHtml(sid,D){
  D=D||view;if(!(D>=1&&D<=7))return '';
  return st.sup.filter(s=>s.days.includes(D)&&(!sid||s.id==sid)).map(s=>`<section class="ps"><div class="mbh"><div class="m1">${esc(st.hdr.a)}</div><div class="m2">${esc(st.hdr.b)}</div>${st.hdr.c?`<div class="m3">${esc(st.hdr.c)}</div>`:''}</div><h2>${esc(s.name)}</h2><p>Semana ${wsel} · Menú ${menuN(wsel,D)}. Pedido del ${esc(fdate(iso(D)))}. Llega el ${DAYS[nx(D)].toLowerCase()}. ${esc(s.phone)}</p><table><tr><th>Artículo</th><th>Stock</th><th>Pedido</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}${i.note?` (${esc(i.note)})`:''}</td><td>${esc(i.stock)}</td><td></td></tr>`).join('')}</table><div class="obs">Observaciones:</div><div class="fir">Firma del economato:</div></section>`).join('');
}
const mbForm=()=>`<details class="card" ${open=='mb'?'open':''}><summary>Membrete (cabecera de las hojas)</summary>${[['a','Línea 1'],['b','Línea 2'],['c','Línea 3 (opcional)']].map(([f,l])=>`<label class="f">${l}<input data-a="hdr" data-f="${f}" value="${esc(st.hdr[f])}"></label>`).join('')}<div style="height:14px"></div></details>`;
const ANCH=new Date(2026,9,5),PK={M:'#2c5d9a',T:'#9a6a14',F:'#4a5a6a',L:'#9aa4b0'},POS=['Mañana 1','Mañana 2','Mañana 3','Tarde 1','Tarde 2','Tarde 3','Libranza 1','Libranza 2','Libranza 3'];
function staffState(w,date){
  const key=dk(date)+'|'+w.id,x=st.exc[key];let on,hrs,sub='',k;
  if(w.type=='rota'){const p=(((w.pos+Math.round((date-ANCH)/864e5))%9)+9)%9;k=p<3?'M':p<6?'T':'L';on=k!='L';sub=POS[p].replace(/ (\d)/,' $1 de 3');hrs=on?st.shifts[k][0]+' a '+st.shifts[k][1]:'Libra'}
  else{on=w.days.includes(date.getDay()||7);k=on?'F':'L';hrs=on?w.from+' a '+w.to:'Libra'}
  return{on:on&&!x,hrs,sub,k,x,key};
}
const pcard=(w,s)=>`<div class="pc ${w.boss?'boss':''} ${s.on?'':'off'}" style="--c:${s.x?'#a8322d':PK[s.k]}"><div class="pr">${esc(w.role)}</div><div class="pn">${esc(w.name||'Pon tu nombre en Personal')}</div><div class="ph">${s.x?esc(s.x):s.hrs}</div>${s.sub?`<div class="ps2">${esc(s.sub)}</div>`:''}<select class="ex" data-a="exc" data-k="${s.key}" aria-label="Incidencia de ${esc(w.name||w.role)}"><option value="">Sin incidencia</option>${['Vacaciones','Baja','Permiso','Cambio de turno'].map(o=>`<option ${s.x==o?'selected':''}>${o}</option>`).join('')}</select></div>`;
function staffHtml(date,isT){
  const L=st.staff.map(w=>({w,s:staffState(w,date)})),n=L.filter(x=>x.s.on).length;
  return `<section class="sec"><h2>${isT?'Personal de hoy':'Personal de este día'}</h2><p class="mt">Trabajan ${n} de ${L.length}.</p><div class="staff">`+L.filter(x=>x.w.boss).map(x=>pcard(x.w,x.s)).join('')+L.filter(x=>!x.w.boss).sort((a,b)=>b.s.on-a.s.on).map(x=>pcard(x.w,x.s)).join('')+'</div></section>';
}
function staffView(){
  const hr=(k,l)=>`<div class="it"><span>${l}</span><input class="sm" data-a="shf" data-k="${k}" data-i="0" value="${esc(st.shifts[k][0])}" aria-label="${l}, entrada"><input class="sm" data-a="shf" data-k="${k}" data-i="1" value="${esc(st.shifts[k][1])}" aria-label="${l}, salida"></div>`;
  return `<h1>Personal</h1><p class="sub">Edita nombres, puestos, horarios y la rotación. Las vacaciones, bajas o cambios de un día se apuntan en la página de ese día.</p><details class="card" ${open=='sh'?'open':''}><summary>Horarios de la rotación</summary>${hr('M','Mañana')}${hr('T','Tarde')}</details>`+
  st.staff.map(w=>`<details class="card" ${open==w.id?'open':''}><summary>${esc(w.name||'Sin nombre')}<span class="cnt">${esc(w.role)}</span></summary>
  <label class="f">Nombre<input data-a="wname" data-w="${w.id}" value="${esc(w.name)}"></label>
  <label class="f">Puesto<input data-a="wrole" data-w="${w.id}" value="${esc(w.role)}"></label>`+
  (w.type=='rota'?`<label class="f">Situación en la rotación el lunes 5 de octubre de 2026<select data-a="wpos" data-w="${w.id}">${POS.map((p,i)=>`<option value="${i}" ${w.pos==i?'selected':''}>${p}</option>`).join('')}</select></label>`:
  `<div class="f">Días de trabajo<div class="days">${[1,2,3,4,5,6,7].map(d=>`<label><input type="checkbox" data-a="wday" data-w="${w.id}" data-d="${d}" ${w.days.includes(d)?'checked':''}>${DAYS[d].slice(0,3)}</label>`).join('')}</div></div><div class="it"><span>Horario</span><input class="sm" data-a="wfrom" data-w="${w.id}" value="${esc(w.from)}" aria-label="Entrada"><input class="sm" data-a="wto" data-w="${w.id}" value="${esc(w.to)}" aria-label="Salida"></div>`)+
  (w.boss?'<div style="height:12px"></div>':`<button class="del" data-a="delW" data-w="${w.id}">${confirmDel==w.id?'Pulsa otra vez para borrar':'Quitar del personal'}</button>`)+'</details>').join('')+
  '<div class="add"><input id="wn" placeholder="Nombre del trabajador"><select id="wt"><option value="fijo">Horario fijo</option><option value="rota">Rotativo (3 mañanas, 3 tardes, 3 libres)</option></select><button class="btn" data-a="addW">Añadir trabajador</button></div>';
}
function dayPage(){
  const d=sel,w=wsel,m=menuN(w,d),date=dateOf(d,w),key=dk(date),isT=w==cw&&d==td;
  const ped=st.sup.filter(s=>s.days.includes(d)),ent=entra(d),nxt=nextWD(date),nk=dk(nxt);
  const prev=st.next.filter(n=>n.for==key),rem=notesFor(m,d),mine=st.next.filter(n=>n.for==nk);
  const del=(a,id)=>`<button class="rm" data-a="${a}" data-n="${id}">Borrar</button>`;
  const opts=`<option value="d:${m}">Solo el menú ${m} (se repite cada 14 días)</option><option value="d:0">Todos los días</option>`+st.sup.map(s=>`<option value="p:${s.id}">Pedido de ${esc(s.name)}</option>`).join('');
  const blk=s=>`<details class="sup" style="--c:${s.color}"><summary><span class="sn">${esc(s.name)}</span><span class="sx">${esc(s.phone)} · llega el ${DAYS[nx(d)].toLowerCase()}</span><button class="pb" data-a="print" data-s="${s.id}" data-d="${d}">Imprimir</button></summary>${s.items.length?`<table class="tb"><tr><th>Artículo</th><th>Stock</th><th>Nota</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.stock)}</td><td>${esc(i.note)}</td></tr>`).join('')}</table>`:'<p class="mt" style="padding:0 12px">Sin artículos. Añádelos en Proveedores.</p>'}</details>`;
  return `<div class="dt">${DAYS[d]}, ${date.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</div><div class="dmenu">Semana ${w} · Menú ${m}${isT?'<span class="today">Hoy</span>':''}</div>`+staffHtml(date,isT)+
  `<section class="sec"><h2>Anotaciones del día anterior</h2>${prev.length?prev.map(n=>`<div class="ln"><label><input type="checkbox" data-a="nchk" data-n="${n.id}" ${n.done?'checked':''}><span class="${n.done?'dn':''}">${esc(n.text)}</span></label>${del('delX',n.id)}</div>`).join(''):'<p class="mt">No hay anotaciones para este día.</p>'}</section>`+
  `<section class="sec"><h2>Recordatorios</h2>${rem.map(n=>`<div class="ln"><span>${esc(n.text)}<small>${esc(noteTag(n))}</small></span>${del('delN',n.id)}</div>`).join('')||'<p class="mt">Sin recordatorios para este día.</p>'}<div class="af"><input id="nt" placeholder="Nuevo recordatorio" aria-label="Nuevo recordatorio"><select id="nw" aria-label="Aplicar a">${opts}</select><button class="btn" data-a="addN">Añadir</button></div></section>`+
  `<section class="sec"><h2>Pedidos que hay que hacer${ped.length?' ('+ped.length+')':''}</h2>${ped.length?`<div class="tl"><button class="btn" data-a="print" data-d="${d}">Imprimir todos los pedidos</button></div>`+ped.map(blk).join(''):'<p class="mt">No hay pedidos programados para este día.</p>'}</section>`+
  `<section class="sec"><h2>${isT?'Hoy entra':'Entra este día'}</h2>${ent.length?ent.map(s=>s.pet?`<details class="sup" open style="--c:${s.color}"><summary><span class="sn">${esc(s.name)}</span><span class="sx">Por petitorio: debe entrar</span></summary><ul class="cols">${s.items.map(i=>`<li>${esc(i.name)}</li>`).join('')}</ul></details>`:`<div class="sup1" style="--c:${s.color}"><span class="sn">${esc(s.name)}</span></div>`).join(''):'<p class="mt">No entra ningún proveedor.</p>'}</section>`+
  (isT?freeHtml():'')+
  `<section class="sec"><h2>Anotar para el día siguiente</h2><p class="mt">Se mostrará el ${esc(longD(nxt))}.</p>${mine.map(n=>`<div class="ln"><span>${esc(n.text)}</span>${del('delX',n.id)}</div>`).join('')}<div class="af"><input id="nx" placeholder="Anotación importante para mañana" aria-label="Anotación para el día siguiente"><button class="btn" data-a="addX" data-k="${nk}">Añadir</button></div></section>`;
}
function shell(){
  const cell=(w,d)=>`<button class="cell ${view=='day'&&sel==d&&wsel==w?'on':''} ${w==cw&&d==td?'td':''}" data-a="day" data-d="${d}" data-w="${w}" aria-label="${DAYS[d]}, menú ${menuN(w,d)}">${DAYS[d].slice(0,3)}<b>M${menuN(w,d)}</b></button>`;
  const hoy=view=='day'&&sel==td&&wsel==cw;
  return `<header class="top"><div><div class="o1">${esc(st.hdr.a)}</div><div class="o2">${esc(st.hdr.b)}${st.hdr.c?' · '+esc(st.hdr.c):''}</div></div><div class="ap">Pedidos diarios${instBtn()}${user?`<div class="ac">${esc(user.email)} · <span id="sync">${esc(syncT)}</span></div><button class="pb sal" data-a="logout">Salir</button>`:''}</div></header>
  <nav class="nav">${[['today','Hoy'],['h','Historial'],['p','Proveedores'],['q','Personal']].map(([k,l])=>`<button class="${(k=='today'?hoy:k==view)?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}</nav>
  <div class="grid">${[1,2].map(w=>`<div class="gr"><span class="gl">Sem. ${w}</span>${[1,2,3,4,5,6,7].map(d=>cell(w,d)).join('')}</div>`).join('')}</div>`;
}
function loginView(){
  const top=`<header class="top"><div><div class="o1">Pedidos diarios</div><div class="o2">Economato</div></div></header>`;
  if(auth.step=='cargando')return top+'<main class="main"><p class="sub" style="margin-top:24px">Cargando…</p></main>';
  if(auth.step=='denegado')return top+`<main class="main"><h1>Sin permiso</h1><p class="sub">El correo ${esc(user&&user.email)} no está autorizado para usar esta aplicación. Pide que lo añadan a la lista de usuarios permitidos.</p>${auth.msg?`<p class="msg">${esc(auth.msg)}</p>`:''}<button class="btn" data-a="logout">Salir</button></main>`;
  return top+`<main class="main"><h1>Entrar</h1><p class="sub">Los datos se guardan en la nube y se comparten entre todos tus dispositivos.</p><form id="login" class="lg"><label class="f">Correo electrónico<input id="le" type="email" autocomplete="email" required></label><label class="f">Contraseña<input id="lp" type="password" autocomplete="current-password" minlength="6" required></label><div class="af" style="padding:14px"><button class="btn" type="submit" data-a="login">Entrar</button><button class="pb" type="submit" data-a="signup">Crear cuenta</button></div></form>${auth.msg?`<p class="msg" role="status">${esc(auth.msg)}</p>`:''}</main>`;
}
function render(){if(auth.step!='app'&&auth.step!='local'){$('app').innerHTML=loginView();return}$('app').innerHTML=shell()+'<main class="main">'+(view=='q'?staffView():view=='h'?histView():view=='p'?supView():dayPage())+'</main>'}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.a,s=st&&find(b.dataset.s);
  if(a=='instalar'){if(instE){instE.prompt();instE.userChoice.finally(()=>{instE=null;render()})}else alert('Para instalar en iPhone o iPad: abre esta página en Safari, pulsa el botón Compartir y elige «Añadir a pantalla de inicio».');return}
  if(a=='logout'){e.preventDefault();if(tmr){clearTimeout(tmr);push()}auth.msg='';sb.auth.signOut();return}
  if(a=='print'){e.preventDefault();$('print').innerHTML=printHtml(b.dataset.s,+b.dataset.d);try{window.print()}catch(x){}return}
  if(a=='go'){const v=b.dataset.v;if(v=='today'){view='day';sel=td;wsel=cw}else view=v;confirmDel=null}
  else if(a=='day'){view='day';sel=+b.dataset.d;wsel=+b.dataset.w}
  else if(a=='extra'){const t=$('fx-'+s.id).value.trim(),k='x'+Date.now()+s.id;st.sent[k]={key:k,date:dk(new Date()),sid:s.id,name:s.name,deliver:'',ts:Date.now(),items:t?[{n:t,q:''}]:[]}}
  else if(a=='delH'){delete st.sent[b.dataset.k]}
  else if(a=='addN'){const t=$('nt').value.trim();if(!t)return;const[k,v]=$('nw').value.split(':');st.notes.push({id:uid(),text:t,kind:k,day:k=='d'?+v:0,sup:k=='p'?v:''})}
  else if(a=='delN'){st.notes=st.notes.filter(n=>n.id!=b.dataset.n)}
  else if(a=='addX'){const t=$('nx').value.trim();if(!t)return;st.next.push({id:uid(),text:t,for:b.dataset.k,done:false})}
  else if(a=='delX'){st.next=st.next.filter(n=>n.id!=b.dataset.n)}
  else if(a=='addS'){const n=$('nn').value.trim();if(!n)return;const x={id:uid(),name:n,phone:'',days:[],items:[],color:PAL[st.sup.length%PAL.length]};st.sup.push(x);open=x.id}
  else if(a=='addI'){const n=$('ni-'+s.id).value.trim();if(!n)return;s.items.push({id:uid(),name:n,stock:$('ns-'+s.id).value.trim(),note:''});open=s.id}
  else if(a=='delI'){s.items=s.items.filter(i=>i.id!=b.dataset.i);open=s.id}
  else if(a=='addW'){const n=$('wn').value.trim();if(!n)return;const x={id:uid(),name:n,role:'Personal de economato',type:$('wt').value,days:[1,2,3,4,5],from:'6:00',to:'13:00',pos:0};st.staff.push(x);open=x.id}
  else if(a=='delW'){const w=st.staff.find(x=>x.id==b.dataset.w);if(confirmDel==w.id){st.staff=st.staff.filter(x=>x.id!=w.id);confirmDel=null;open=null}else{confirmDel=w.id;open=w.id}}
  else if(a=='delS'){if(confirmDel==s.id){st.sup=st.sup.filter(x=>x.id!=s.id);confirmDel=null;open=null}else{confirmDel=s.id;open=s.id}}
  else return;
  save();render();window.scrollTo(0,a=='go'||a=='day'?0:scrollY);
});
document.addEventListener('change',e=>{
  if(!st)return;const t=e.target,a=t.dataset.a,s=find(t.dataset.s);
  if(a=='nchk'){st.next.find(n=>n.id==t.dataset.n).done=t.checked}
  else if(a=='name'&&t.value.trim()){s.name=t.value.trim();open=s.id}
  else if(a=='phone'){s.phone=t.value.trim();open=s.id}
  else if(a=='pet'){s.pet=t.checked;open=s.id}
  else if(a=='hdr'){st.hdr[t.dataset.f]=t.value.trim();open='mb'}
  else if(a=='color'){s.color=t.value;open=s.id}
  else if(a=='day'){const d=+t.dataset.d;s.days=t.checked?[...s.days,d].sort():s.days.filter(x=>x!=d);open=s.id}
  else if(a=='iname'||a=='istock'||a=='inote'){const i=s.items.find(x=>x.id==t.dataset.i);const f={iname:'name',istock:'stock',inote:'note'}[a];if(f=='name'&&!t.value.trim())return;i[f]=t.value.trim();open=s.id}
  else if(a=='exc'){if(t.value)st.exc[t.dataset.k]=t.value;else delete st.exc[t.dataset.k]}
  else if(a=='shf'){st.shifts[t.dataset.k][+t.dataset.i]=t.value.trim();open='sh'}
  else if(a=='wname'||a=='wrole'||a=='wpos'||a=='wday'||a=='wfrom'||a=='wto'){const w=st.staff.find(x=>x.id==t.dataset.w);open=w.id;
    if(a=='wname')w.name=t.value.trim();else if(a=='wrole')w.role=t.value.trim();else if(a=='wpos')w.pos=+t.value;else if(a=='wfrom')w.from=t.value.trim();else if(a=='wto')w.to=t.value.trim();
    else{const d=+t.dataset.d;w.days=t.checked?[...w.days,d].sort():w.days.filter(x=>x!=d)}}
  else return;
  save();render();
});
document.addEventListener('submit',async e=>{
  if(e.target.id!='login')return;e.preventDefault();
  const f=e.target,email=$('le').value.trim(),password=$('lp').value,m=(e.submitter&&e.submitter.dataset.a)||'login';
  f.querySelectorAll('button').forEach(x=>x.disabled=true);
  const r=m=='signup'?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)auth.msg=r.error.message=='Invalid login credentials'?'Correo o contraseña incorrectos.':r.error.message;
  else if(m=='signup'&&!r.data.session)auth.msg='Te hemos enviado un correo. Abre el enlace para confirmar la cuenta y después entra aquí.';
  else auth.msg='';
  if(auth.step=='login')render();
});
window.addEventListener('online',()=>{if(!user)return;if(offline)boot();else if(sucio)push()});
if('serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('afterprint',()=>{$('print').innerHTML=''});
if(sb)sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?ses.user:null;if(ev=='INITIAL_SESSION'||(u&&u.id)!==(user&&user.id)){user=u;setTimeout(boot,0)}else user=u});
else{st=load()||{sup:seed(),done:{},qty:{}};prep();keep();render()}
</script>
